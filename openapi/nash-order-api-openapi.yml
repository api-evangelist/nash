    RouteSerializer:
      title: RouteSerializer
      required:
      - id
      - portalUrl
      - type
      - stops
      type: object
      properties:
        id:
          title: Id
          type: string
          description: Unique identifier for the route.
          example: rte_JphRWDiEosGpXuxwgaYfY3
        externalId:
          title: Externalid
          anyOf:
