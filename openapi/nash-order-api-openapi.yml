        ``success`` means the row was upserted (created or updated). ``failed`` is reserved for hard

        errors (a precondition violation, lock contention, a missing required field, an unexpected

        error). Soft/validation issues that still persist the row are *not* failures — surface those on

        the returned object, not here.'
