    ZonesQueryRequest:
      title: ZonesQueryRequest
      type: object
      properties:
        ids:
          title: Ids
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Nash zone ids to fetch (max 500). Combined with `externalIds` using OR. Omit to not filter by id; an empty list matches nothing.
          default: null
          example:
          - zone_BBVtiSryYx34xCskjb2WmA
        externalIds:
          title: Externalids
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Your external zone ids to fetch (max 500). Combined with `ids` using OR. Omit to not filter by external id; an empty list matches nothing.
          default: null
          example:
          - 7810BBTORQ
        isDeleted:
          title: Isdeleted
          type: boolean
          description: When true, return soft-deleted zones instead of active ones.
          default: false
        size:
          title: Size
          type: integer
          description: Page size, 1 to 500. Requests above 500 return a ZONE_BULK_LIMIT_EXCEEDED error.
          default: 100
        offset:
          title: Offset
          type: integer
          description: Number of zones to skip, for paging through the full result set.
          default: 0
      description: 'Body for `POST /v1/zones/query`.


        `ids` and `externalIds` are optional and combined with OR. Omit both to

        page through every zone in the organization; a provided but empty list

        matches nothing.'
      example:
        externalIds:
        - 7810BBTORQ
        - 7810BBWAUR
        isDeleted: false
        offset: 0
        size: 100
