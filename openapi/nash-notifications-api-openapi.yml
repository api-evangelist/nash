          title: Title
          type: string
          description: Human-readable title.
        value:
          $ref: '#/components/schemas/NotificationTriggerType'
          description: Pipe-delimited subscription id used by agent executions (closed set; one per trigger).
        entityType:
          $ref: '#/components/schemas/TriggerEntityType'
          description: Primary entity this trigger relates to.
        category:
          $ref: '#/components/schemas/TriggerEntityType'
          description: Coarse grouping (currently the entity type).
        isFlag:
          title: Isflag
          type: boolean
          description: Whether this is a flag-style trigger.
          default: false
        creatable:
          title: Creatable
          type: boolean
          description: Whether an agent can create this trigger via POST /v1/notification-triggers. False for system-generated triggers (e.g. route execution exceptions) that have no create variant — its parametersSchema is empty for that reason, not because it takes no parameters.
          default: false
        description:
          title: Description
          type: string
          description: Description of when the trigger fires.
          default: ''
        statuses:
          title: Statuses
          type: array
          items:
            $ref: '#/components/schemas/EntityStatus'
          description: The exact valid on_statuses for THIS trigger (subset of the EntityStatus enum); empty for non status-transition triggers.
        parametersSchema:
          title: Parametersschema
          type: object
          additionalProperties: true
          description: JSON Schema of this trigger's create parameters.
        supportedActions:
          title: Supportedactions
          type: array
          items:
            $ref: '#/components/schemas/ActionKey'
          description: Action keys this trigger supports.
        supportedFilters:
          title: Supportedfilters
          type: array
          items:
            $ref: '#/components/schemas/FilterCriterionKey'
          description: Filter-criteria keys this trigger supports.
      description: A single trigger type in the notification trigger catalog.
    ActivityStatusTransitionParams:
      title: ActivityStatusTransitionParams
      required:
      - activityStatus
      - activityActions
      type: object
      properties:
        activityStatus:
          $ref: '#/components/schemas/ActivityStatus'
        activityActions:
          title: Activityactions
          type: array
          items:
            $ref: '#/components/schemas/ActivityAction'
    CreateCustomEventListenerTrigger:
      title: CreateCustomEventListenerTrigger
      required:
      - name
      - notificationGroupIds
      - type
      - parameters
      type: object
      properties:
        name:
          title: Name
          minLength: 1
          type: string
          description: Human-readable name for this trigger instance.
        notificationGroupIds:
          title: Notificationgroupids
          type: array
          items:
            type: string
          description: IDs of the notification groups that will receive notifications when this trigger fires.
        description:
          title: Description
          anyOf:
          - type: string
          - type: 'null'
          description: Optional description of the trigger.
          default: null
        enabled:
          title: Enabled
          type: boolean
          description: Whether the trigger is enabled on creation. Defaults to true.
          default: true
        message:
          title: Message
          anyOf:
          - type: string
          - type: 'null'
          description: Optional custom message body.
          default: null
        flag:
          title: Flag
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether firing this trigger should also flag the job for operator attention.
          default: null
        autoResolveFlag:
          title: Autoresolveflag
          anyOf:
          - type: boolean
          - type: 'null'
          description: If true, a flag raised by this trigger resolves automatically when the flag condition clears.
          default: null
        optionsGroupIds:
          title: Optionsgroupids
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Options groups that scope when this trigger applies.
          default: null
        contractIds:
          title: Contractids
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Contract IDs that scope when this trigger applies.
          default: null
        isInternal:
          title: Isinternal
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether the trigger is for internal use only (not exposed to customers).
          default: null
        zoneIds:
          title: Zoneids
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Zone IDs that scope when this trigger applies (separate from zone-geolocation parameters).
          default: null
        customEventName:
          title: Customeventname
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          description: For triggers that emit a custom event when fired, the name of that event.
          default: null
        conditionalLogic:
          title: Conditionallogic
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
          description: Optional AND/OR conditional tree that gates when the trigger fires. Shape mirrors the Zod ConditionalStatement schema in nash-ui; currently passed through as JSON. A follow-up will type this explicitly.
          default: null
        type:
          title: Type
          type: string
          const: custom_event_listener
        parameters:
          $ref: '#/components/schemas/CustomEventListenerParams'
  securitySchemes:
    Token:
      type: http
      scheme: bearer
      bearerFormat: JWT, API Key
