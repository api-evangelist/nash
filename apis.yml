aid: nash
name: Nash
description: >-
  Nash is an AI-powered last-mile delivery orchestration platform that lets
  retailers, restaurants, grocers, pharmacies, and logistics teams quote,
  dispatch, and track deliveries across a network of third-party couriers and
  their own internal fleets from a single API. The Nash Platform API covers
  orders, jobs (deliveries), quoting, dispatch strategies, route optimization,
  delivery windows, zones, store locations, shifts, store catalog, notifications,
  and signed webhooks, alongside a Fleet API for owned-fleet delivery reporting
  and a Nash Agent copilot exposed over a Model Context Protocol (MCP) server for
  agent-driven delivery operations. Backed by a16z.
url: https://raw.githubusercontent.com/api-evangelist/nash/refs/heads/main/apis.yml
